# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Dimensions is a static, phone-installable web app in public/ (WebGL + Web Audio +
# motion sensors, manifest + service worker; no framework, server or build).
# Render publishes public/. Everything runs on the visitor's phone, so the free
# static plan is all it needs.
#
# Deploy: in Render choose New > Blueprint and point it at this repository.

services:
  - type: web
    name: meditation-statev1
    runtime: static

    # No `plan` key: static sites have no compute plan, and the validator
    # rejects one.

    # Nothing to compile or download. Render still runs a build step, so it
    # is a no-op.
    buildCommand: echo "No build step - publishing public/"
    staticPublishPath: ./public

    buildFilter:
      paths:
        - public/**
        - render.yaml

    headers:
      # One file, not fingerprinted: always revalidate so a deploy reaches
      # everyone immediately.
      - path: /*
        name: Cache-Control
        value: no-cache

      # The app loads only its own scripts, styles and service worker, the Syne
      # font from Google Fonts, and audio from files the visitor picks (blob: URLs).
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src 'self' blob:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"

      # Microphone (music and the Hibernation room), motion sensors (look around,
      # vibration) and keeping the screen awake. Nothing else.
      - path: /*
        name: Permissions-Policy
        value: "microphone=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), screen-wake-lock=(self), camera=(), geolocation=()"

      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    # Single page, no client-side routes: nothing to rewrite.
    routes: []
